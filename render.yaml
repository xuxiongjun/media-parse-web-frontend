# 前端请创建 Static Site（不要选 Docker Web Service）
# New → Static Site → 连接本仓库后按下列配置
services:
  - type: web
    name: media-parse-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        # 必须改成真实后端地址（不要用 xxxx 占位），例如：
        # https://media-parse-web-server.onrender.com
        sync: false
