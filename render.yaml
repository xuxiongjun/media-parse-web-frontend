# 前端请创建 Static Site（不要选 Docker Web Service）
# New → Static Site → 连接本仓库后按下列配置
services:
  - type: web
    name: media-parse-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        # 在 Dashboard 里改成你的后端地址，例如 https://media-parse-web-server-xxxx.onrender.com
        sync: false
